<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture screen or window</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="screen.css" />
  </head>
  <body>
    <main>
      <div class="frame crop-marks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
      </div>
      <h1>Capture a screen or window</h1>
      <p>Pick a whole screen, an app window or a browser tab. The picture opens in the editor.</p>
      <button id="choose" class="primary">Choose what to capture</button>
      <p id="status" role="status"></p>
    </main>
    <script src="screen.js" type="module"></script>
  </body>
</html>
