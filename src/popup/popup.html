<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture and Annotate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon32.png" alt="" width="20" height="20" />
      <span>Capture and Annotate</span>
    </header>
    <main>
      <button data-mode="area" data-command="capture-area">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" /><rect x="8" y="8" width="8" height="8" rx="1" /></svg>
        <span class="label">Select area</span>
        <kbd></kbd>
      </button>
      <button data-mode="visible" data-command="capture-visible">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 9h18" /></svg>
        <span class="label">Visible part</span>
        <kbd></kbd>
      </button>
      <button data-mode="full" data-command="capture-full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2" /><path d="M9 7h6M9 11h6M9 15h4" /></svg>
        <span class="label">Full page</span>
        <kbd></kbd>
      </button>
    </main>
    <footer>
      <a href="#" id="shortcuts">Change shortcuts</a>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
