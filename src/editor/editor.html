<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture and Annotate</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="group" role="toolbar" aria-label="Edit tools">
        <button data-tool="crop" title="Crop (C)">
          <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2" /></svg>
        </button>
        <button data-tool="pen" title="Pen (P)">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
        </button>
        <button data-tool="highlight" title="Highlighter (H)">
          <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" /></svg>
        </button>
        <button data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" /></svg>
        </button>
        <button data-tool="arrow" title="Arrow (A)">
          <svg viewBox="0 0 24 24"><path d="M5 19 19 5M9 5h10v10" /></svg>
        </button>
        <button data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16" /></svg>
        </button>
        <button data-tool="blur" title="Blur / hide (B)">
          <svg viewBox="0 0 24 24"><path d="M3 3h6v6H3zM15 3h6v6h-6zM9 9h6v6H9zM3 15h6v6H3zM15 15h6v6h-6z" /></svg>
        </button>
      </div>

      <div class="group" aria-label="Style">
        <div class="swatches">
          <button class="swatch" data-color="#ef4444" style="--c: #ef4444" title="Red"></button>
          <button class="swatch" data-color="#f59e0b" style="--c: #f59e0b" title="Yellow"></button>
          <button class="swatch" data-color="#22c55e" style="--c: #22c55e" title="Green"></button>
          <button class="swatch" data-color="#2563eb" style="--c: #2563eb" title="Blue"></button>
          <button class="swatch" data-color="#111827" style="--c: #111827" title="Black"></button>
          <label class="swatch custom" title="Custom colour">
            <input type="color" id="custom-color" value="#a855f7" />
          </label>
        </div>
        <div class="sizes">
          <button data-size="s" title="Thin">S</button>
          <button data-size="m" title="Medium">M</button>
          <button data-size="l" title="Thick">L</button>
        </div>
      </div>

      <div class="group">
        <button id="undo" title="Undo (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h11a5 5 0 0 1 0 10h-3" /></svg>
        </button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9a5 5 0 0 0 0 10h3" /></svg>
        </button>
      </div>

      <div class="group save">
        <button id="copy" class="text" title="Copy image (Ctrl+C)">Copy</button>
        <button id="save-png" class="text" title="Save as PNG (Ctrl+S)">PNG</button>
        <button id="save-jpg" class="text" title="Save as JPG">JPG</button>
        <button id="save-pdf" class="text primary" title="Save as PDF">Save PDF</button>
      </div>
    </header>

    <main id="workspace">
      <div id="stage" hidden>
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <p id="message">Loading capture…</p>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="editor.js" type="module"></script>
  </body>
</html>
